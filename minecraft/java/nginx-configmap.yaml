apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-java-nginx-config
  namespace: minecraft-java
  labels:
    app: minecraft-java-nginx
data:
  nginx.conf: |
    worker_processes 1;

    events {
      worker_connections 1024;
    }

    stream {
      upstream minecraft {
        server minecraft-java-headless:25565;
      }

      server {
        listen 25565;
        proxy_pass minecraft;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
      }
    }
